version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: dulcerojo-mysql
    environment:
      MYSQL_DATABASE: dulcerojodb
      MYSQL_ROOT_PASSWORD: cambiame_local
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcambiame_local"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: dulcerojo-app
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/dulcerojodb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: cambiame_local