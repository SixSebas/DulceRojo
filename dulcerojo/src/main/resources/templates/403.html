<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{error403.titulo} + ' | Dulce Rojo'">
        Acceso denegado | Dulce Rojo
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-5 text-center" style="max-width: 520px;">
        <div class="card shadow border-0">
            <div class="card-body p-5">

                <h1 class="h3 mt-3 mb-2"
                    th:text="#{error403.encabezado}">
                    403 - Acceso denegado
                </h1>

                <p class="text-muted"
                   th:text="#{error403.mensaje}">
                    Tu usuario está logueado, pero no tiene el rol necesario para
                    realizar esta acción. Crear, editar o eliminar productos
                    requiere el rol ADMIN.
                </p>

                <a class="btn btn-brand mt-2"
                   href="/productos"
                   th:text="#{error403.volver}">
                    Volver al catálogo
                </a>

            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
