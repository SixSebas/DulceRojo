<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${producto.id == null} ? #{producto.form.nuevo} : #{producto.form.editar}">
        Producto
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">

                <li class="breadcrumb-item">
                    <a href="/" th:text="#{producto.form.inicio}">
                        Inicio
                    </a>
                </li>

                <li class="breadcrumb-item">
                    <a href="/productos" th:text="#{producto.form.catalogo}">
                        Catálogo
                    </a>
                </li>

                <li class="breadcrumb-item active"
                    th:text="${producto.id == null} ? #{producto.form.nuevo} : #{producto.form.editar}">
                    Formulario
                </li>

            </ol>
        </nav>

        <div class="card border-0 shadow">

            <div class="card-header text-white" style="background-color: #55353a;">
                <h2 class="mb-0"
                    th:text="${producto.id == null} ? #{producto.form.nuevo} : #{producto.form.editar}">
                    Producto
                </h2>
            </div>

            <div class="card-body">

                <form th:action="${producto.id == null} ? @{/productos} : @{/productos/{id}(id=${producto.id})}"
                      th:object="${producto}"
                      method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">

                        <label class="form-label"
                               th:text="#{producto.form.nombre}">
                            Nombre
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{nombre}">

                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('nombre')}"
                             th:errors="*{nombre}">
                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label"
                               th:text="#{producto.form.descripcion}">
                            Descripción
                        </label>

                        <textarea class="form-control"
                                  th:field="*{descripcion}">
                        </textarea>

                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('descripcion')}"
                             th:errors="*{descripcion}">
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label"
                                   th:text="#{producto.form.precio}">
                                Precio (₡)
                            </label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   th:field="*{precio}">

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('precio')}"
                                 th:errors="*{precio}">
                            </div>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label"
                                   th:text="#{producto.form.stock}">
                                Stock
                            </label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{stock}">

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('stock')}"
                                 th:errors="*{stock}">
                            </div>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label"
                                   for="categoria"
                                   th:text="#{producto.form.categoria}">
                                Categoría
                            </label>

                            <select class="form-select"
                                    id="categoria"
                                    th:field="*{categoria}">

                                <option value=""
                                        th:text="#{producto.form.seleccionar-categoria}">
                                    Seleccione una categoría
                                </option>

                                <option th:each="categoria : ${categorias}"
                                        th:value="${categoria.id}"
                                        th:text="${categoria.nombre}">
                                    Categoría
                                </option>

                            </select>

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('categoria')}"
                                 th:errors="*{categoria}">
                            </div>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label"
                                   th:text="#{producto.form.imagen}">
                                Imagen (URL)
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{imagen}">

                        </div>

                    </div>

                    <div class="d-flex gap-2 mt-3">

                        <button type="submit"
                                class="btn btn-brand">
                            <i class="bi bi-save me-1"></i>
                            <span th:text="#{producto.form.guardar}">
                                Guardar
                            </span>
                        </button>

                        <a href="/productos"
                           class="btn btn-secondary"
                           th:text="#{producto.form.cancelar}">
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>
        </div>

    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
