<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Dulce Rojo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4">

        <h1 class="mb-4">🛒 Mi Carrito</h1>

        <div class="alert alert-success alert-dismissible fade show" th:if="${ok}">
            <span th:text="${ok}">Operación realizada</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="alert alert-danger alert-dismissible fade show" th:if="${error}">
            <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${carrito.isEmpty()}" class="alert alert-warning">
            <i class="bi bi-cart-x me-2"></i>
            Tu carrito está vacío. <a href="/productos">Ver catálogo</a>
        </div>

        <div th:if="${!carrito.isEmpty()}">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Precio unitario</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item, iter : ${carrito}">
                                <td th:text="${item.producto.nombre}">Nombre</td>
                                <td>₡<span th:text="${item.precio}">0</span></td>
                                <td th:text="${item.cantidad}">1</td>
                                <td>₡<span th:text="${item.precio * item.cantidad}">0</span></td>
                                <td>
                                    <form th:action="@{/carrito/eliminar/{i}(i=${iter.index})}" method="post">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr class="fw-bold">
                                <td colspan="3">Total</td>
                                <td>₡<span th:text="${total}">0</span></td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <div class="d-flex gap-2 justify-content-end">
                <a href="/productos" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Seguir comprando
                </a>
                <form th:action="@{/carrito/confirmar}" method="post">
                    <button type="submit" class="btn btn-brand">
                        <i class="bi bi-check-circle me-1"></i> Confirmar pedido
                    </button>
                </form>
            </div>
        </div>

    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
