<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark mb-4" style="background-color: #55353a;">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                🍪 Dulce Rojo
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" th:text="#{nav.inicio}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/productos}" th:text="#{nav.catalogo}">Catálogo</a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto align-items-center gap-2">

                    <!-- Selector de idioma -->
                    <li class="nav-item d-flex gap-1">
                        <a class="btn btn-outline-light btn-sm" style="min-width: 40px; text-align: center;"
                            th:href="@{/cambiar-idioma(lang=es)}" th:text="#{nav.idioma.es}">ES</a>
                        <a class="btn btn-outline-light btn-sm" style="min-width: 40px; text-align: center;"
                            th:href="@{/cambiar-idioma(lang=en)}" th:text="#{nav.idioma.en}">EN</a>
                    </li>

                    <!-- Separador -->
                    <li class="nav-item text-white-50">|</li>

                    <!-- Login/Registro/Logout -->
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link" th:href="@{/login}" th:text="#{nav.login}">Iniciar sesión</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link" th:href="@{/registro}" th:text="#{nav.registro}">Registrarse</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm"
                                style="min-width: 110px; text-align: center;" th:text="#{nav.logout}">
                                Cerrar sesión
                            </button>
                        </form>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <footer th:fragment="footer" class="text-center py-4 mt-5 border-top" style="color: #988484;">
        <small>🍪 Dulce Rojo - SC-403</small>
    </footer>

</body>

</html>
