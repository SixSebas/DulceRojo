<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Dulce Rojo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1" th:text="#{productos.titulo}">Nuestras Galletas</h1>
                <p class="text-muted mb-0">
                    <span th:text="#{productos.total}">Total</span>:
                    <span class="badge bg-secondary" th:text="${productos.size()}">0</span>
                </p>
            </div>
            <a class="btn btn-brand" th:href="@{/productos/nuevo}" sec:authorize="hasRole('ADMIN')"
                th:text="#{productos.nuevo}">Nuevo producto</a>
        </div>

        <!-- Flash de éxito -->
        <div class="alert alert-success alert-dismissible fade show" th:if="${ok}">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${ok}">Operación realizada</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Listado de productos -->
        <div class="row g-3">
            <div class="col-12 col-md-6 col-lg-4" th:each="p : ${productos}">
                <div class="card h-100 shadow-sm card-hover">

                    <!-- Imagen del producto -->
                    <img th:if="${p.imagen != null and !p.imagen.isEmpty()}" th:src="${p.imagen}" class="card-img-top"
                        style="height: 180px; object-fit: cover;" alt="Imagen del producto">

                    <div class="card-body d-flex flex-column">

                        <!-- Categoría y estado -->
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge bg-secondary"
                                th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}">
                                Categoría
                            </span>
                            <div class="d-flex gap-1">
                                <span class="badge bg-danger" th:if="${p.agotado}">Agotado</span>
                                <span class="badge bg-warning text-dark" th:if="${p.bajoStock}">Bajo stock</span>
                            </div>
                        </div>

                        <!-- Nombre -->
                        <h5 class="card-title" th:text="${p.nombre}">Nombre</h5>

                        <!-- Descripción -->
                        <p class="text-muted small flex-grow-1" th:text="${p.descripcion}">Descripción</p>

                        <!-- Precio y stock -->
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <span class="precio">₡<span th:text="${p.precio}">0</span></span>
                            <small class="text-muted">
                                <i class="bi bi-box me-1"></i>
                                <span th:text="${p.stock}">0</span> unidades
                            </small>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex gap-2 mt-3">
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/productos/{id}(id=${p.id})}"
                                th:text="#{productos.ver}">Ver
                            </a>
                            <a class="btn btn-outline-secondary btn-sm" th:href="@{/productos/{id}/editar(id=${p.id})}"
                                sec:authorize="hasRole('ADMIN')" th:text="#{productos.editar}">Editar
                            </a>
                            <button type="button" class="btn btn-outline-danger btn-sm" data-bs-toggle="modal"
                                data-bs-target="#modalEliminar" th:data-id="${p.id}" th:data-nombre="${p.nombre}"
                                sec:authorize="hasRole('ADMIN')" th:text="#{productos.eliminar}">Eliminar
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Sin productos -->
        <div class="alert alert-warning mt-4" th:if="${productos.isEmpty()}">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span th:text="#{productos.sin-productos}">No hay productos para mostrar.</span>
        </div>

    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>

    <!-- Modal eliminar -->
    <div class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle me-2"></i> Eliminar producto
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>¿Estás seguro que querés eliminar <strong id="nombreProductoEliminar">...</strong>?</p>
                    <p class="text-muted small mb-0">Esta acción no se puede deshacer.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <form id="formEliminar" method="post" th:action="@{/productos/0/eliminar}">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i> Sí, eliminar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('modalEliminar');
            if (modal) {
                modal.addEventListener('show.bs.modal', (event) => {
                    const boton = event.relatedTarget;
                    const id = boton.getAttribute('data-id');
                    const nombre = boton.getAttribute('data-nombre');
                    document.getElementById('nombreProductoEliminar').textContent = nombre;
                    document.getElementById('formEliminar').action = '/productos/' + id + '/eliminar';
                });
            }
        });
    </script>

</body>

</html>
