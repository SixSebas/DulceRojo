<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${producto != null} ? ${producto.nombre} : 'Producto no encontrado'">Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container my-4">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Inicio</a></li>
                <li class="breadcrumb-item"><a href="/productos">Catálogo</a></li>
                <li class="breadcrumb-item active" th:text="${producto != null} ? ${producto.nombre} : 'No encontrado'">
                    Producto
                </li>
            </ol>
        </nav>

        <!-- Producto encontrado -->
        <div th:if="${producto != null}" class="card border-0 shadow">
            <div class="card-header text-white" style="background-color: #55353a;">
                <h2 class="mb-0" th:text="${producto.nombre}">Nombre</h2>
            </div>
            <div class="card-body">

                <img th:if="${producto.imagen != null and !producto.imagen.isEmpty()}" th:src="${producto.imagen}"
                    class="img-fluid rounded mb-3" style="max-height: 300px; object-fit: cover; width: 100%;"
                    alt="Imagen del producto">

                <p class="lead" th:text="${producto.descripcion}">Descripción</p>

                <div class="row mt-4">
                    <div class="col-md-4">
                        <div class="border rounded p-3 text-center">
                            <i class="bi bi-tag" style="font-size:1.5rem; color:#bb9ea1;"></i>
                            <div class="small text-muted mt-2">Precio</div>
                            <div class="h4 mb-0">₡<span th:text="${producto.precio}">0</span></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="border rounded p-3 text-center">
                            <i class="bi bi-box" style="font-size:1.5rem; color:#bb9ea1;"></i>
                            <div class="small text-muted mt-2">Stock</div>
                            <div class="h4 mb-0" th:text="${producto.stock}">0</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="border rounded p-3 text-center">
                            <i class="bi bi-grid" style="font-size:1.5rem; color:#bb9ea1;"></i>
                            <div class="small text-muted mt-2">Categoría</div>
                            <div class="h6 mb-0"
                                th:text="${producto.categoria != null ? producto.categoria.nombre : 'Sin categoría'}">
                                Categoría
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <a class="btn btn-secondary" href="/productos">
                        <i class="bi bi-arrow-left me-1"></i> Volver
                    </a>
                    <a class="btn btn-outline-secondary" th:href="@{/productos/{id}/editar(id=${producto.id})}"
                        sec:authorize="hasRole('ADMIN')">
                        <i class="bi bi-pencil me-1"></i>
                        <span th:text="#{productos.editar}">Editar</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Producto no encontrado -->
        <div th:if="${producto == null}" class="alert alert-warning">
            <h4 class="alert-heading">
                <i class="bi bi-exclamation-triangle me-2"></i> Producto no encontrado
            </h4>
            <p>No existe un producto con ese ID.</p>
            <a class="btn btn-warning" href="/productos">Volver al catálogo</a>
        </div>

    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
