<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.titulo} + ' | Dulce Rojo'">Iniciar Sesión | Dulce Rojo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0">
                    <div class="card-header text-white text-center py-3" style="background-color: #55353a;">
                        <h4 class="mb-0">
                            🍪 <span th:text="#{login.titulo}">Iniciar Sesión</span>
                        </h4>
                    </div>

                    <div class="card-body p-4">

                        <div class="alert alert-danger" th:if="${param.error}" th:text="#{login.error}">
                            Correo o contraseña incorrectos.
                        </div>

                        <div class="alert alert-success" th:if="${param.logout}" th:text="#{login.logout}">
                            Sesión cerrada correctamente.
                        </div>

                        <div class="alert alert-success" th:if="${ok}" th:text="${ok}">
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label" th:text="#{login.correo}">
                                    Correo
                                </label>

                                <input type="email" name="username" class="form-control" placeholder="tu@correo.com">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" th:text="#{login.password}">
                                    Contraseña
                                </label>

                                <input type="password" name="password" class="form-control" placeholder="••••••••">
                            </div>

                            <button type="submit" class="btn btn-brand w-100" th:text="#{login.ingresar}">
                                Ingresar
                            </button>
                        </form>

                        <hr>

                        <p class="text-center text-muted small">
                            <span th:text="#{login.sin-cuenta}">
                                ¿No tenés cuenta?
                            </span>

                            <a th:href="@{/registro}" th:text="#{login.registro}">
                                Registrate aquí
                            </a>
                        </p>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
