<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{registro.titulo} + ' | Dulce Rojo'">Registro | Dulce Rojo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">

                    <div class="card-header text-white text-center py-3" style="background-color: #55353a;">
                        <h4 class="mb-0">
                            🍪 <span th:text="#{registro.crear-cuenta}">Crear cuenta</span>
                        </h4>
                    </div>

                    <div class="card-body p-4">

                        <form th:action="@{/registro}" th:object="${usuario}" method="post">

                            <div class="mb-3">
                                <label class="form-label"
                                       th:text="#{registro.nombre}">
                                    Nombre
                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{nombre}"
                                       th:placeholder="#{registro.nombre-placeholder}"
                                       placeholder="Tu nombre completo">

                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('nombre')}"
                                     th:errors="*{nombre}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"
                                       th:text="#{registro.correo}">
                                    Correo
                                </label>

                                <input type="email"
                                       class="form-control"
                                       th:field="*{correo}"
                                       placeholder="tu@correo.com">

                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('correo')}"
                                     th:errors="*{correo}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"
                                       th:text="#{registro.password}">
                                    Contraseña
                                </label>

                                <input type="password"
                                       class="form-control"
                                       th:field="*{contrasena}"
                                       placeholder="••••••••">

                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('contrasena')}"
                                     th:errors="*{contrasena}">
                                </div>
                            </div>

                            <button type="submit"
                                    class="btn btn-brand w-100"
                                    th:text="#{registro.boton}">
                                Registrarse
                            </button>

                        </form>

                        <hr>

                        <p class="text-center text-muted small">
                            <span th:text="#{registro.ya-cuenta}">
                                ¿Ya tenés cuenta?
                            </span>

                            <a th:href="@{/login}"
                               th:text="#{registro.login}">
                                Iniciá sesión aquí
                            </a>
                        </p>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
