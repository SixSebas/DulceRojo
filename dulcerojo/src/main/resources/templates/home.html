<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulce Rojo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold" style="color: #55353a;">
                🍪 Bienvenido a Dulce Rojo
            </h1>
            <p class="lead text-muted">
                Galletas artesanales estilo New York, horneadas con amor.
            </p>
            <a th:href="@{/productos}" class="btn btn-brand btn-lg">
                <i class="bi bi-grid me-2"></i>Ver catálogo
            </a>
        </div>

        <div class="row g-3">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm card-hover">
                    <div class="card-body text-center">
                        <i class="bi bi-cookie" style="font-size:2rem; color:#bb9ea1;"></i>
                        <h5 class="card-title mt-2">Galletas Clásicas</h5>
                        <p class="card-text small text-muted">
                            Chocolate chip, avena y mantequilla de maní.
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm card-hover">
                    <div class="card-body text-center">
                        <i class="bi bi-stars" style="font-size:2rem; color:#bb9ea1;"></i>
                        <h5 class="card-title mt-2">Edición Especial</h5>
                        <p class="card-text small text-muted">
                            Sabores únicos de temporada y ediciones limitadas.
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm card-hover">
                    <div class="card-body text-center">
                        <i class="bi bi-truck" style="font-size:2rem; color:#bb9ea1;"></i>
                        <h5 class="card-title mt-2">Pedidos</h5>
                        <p class="card-text small text-muted">
                            Hacé tu pedido en línea y recibilo en tu puerta.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
